id: argocd
name: Argo CD
category: CI/CD
description: >-
  GitOps continuous delivery: Argo CD keeps the cluster in step with
  manifests, Helm charts and Kustomize apps in Git repositories.
namespace: argocd
requires: About 1 GB of memory.
tags: [gitops, argocd, cd]
fields:
  - key: domain
    label: Argo CD domain
    type: domain
    section: Domain
    placeholder: argocd.example.com
    hint: Where people open Argo CD from outside the cluster, and where Git webhooks reach it. Empty keeps it inside; Kube Desk still opens it through a port forward.
  - key: ingressClass
    label: Ingress class
    type: ingressClass
    section: Domain
    showIf: domain
  - key: tlsIssuer
    label: HTTPS certificate from
    type: clusterIssuer
    section: Domain
    showIf: domain
    hint: A cert-manager ClusterIssuer, such as letsencrypt. Empty serves plain HTTP.
  - key: ha
    label: Redis with high availability
    type: bool
    section: Argo CD
    hint: Needs three nodes or more.
    advanced: true
components:
  - name: argocd
    title: Argo CD
    helm:
      repo: https://argoproj.github.io/argo-helm
      chart: argo-cd
      version: 10.11.7
      values: |
        {{- if .domain }}
        global:
          domain: {{ .domain }}
        server:
          ingress:
            enabled: true
            {{- if .ingressClass }}
            ingressClassName: {{ .ingressClass }}
            {{- end }}
            {{- if .tlsIssuer }}
            annotations:
              cert-manager.io/cluster-issuer: {{ .tlsIssuer }}
            tls: true
            {{- end }}
        {{- end }}
        configs:
          params:
            # The app reaches the server through a port forward.
            server.insecure: true
        redis-ha:
          enabled: {{ .ha }}
access:
  - label: Argo CD
    service: argocd-server
    port: 80
    user: admin
    passwordSecret: argocd-initial-admin-secret/password
    domain: domain
    tls: tlsIssuer
notes: |
  {{- if .domain }}
  Argo CD is published at **{{ if .tlsIssuer }}https{{ else }}http{{ end }}://{{ .domain }}**: point the DNS of
  `{{ .domain }}` at the address of the ingress controller.

  {{ end -}}
  Open **Argo CD** and sign in as `admin` with the password from **Copy
  password**. Change it under **User Info**, then delete the secret
  `argocd-initial-admin-secret`.

  Add a repository under **Settings → Repositories**, then a first
  application with **New app**.
