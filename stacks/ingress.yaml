id: ingress
name: Traefik + cert-manager
category: Networking
description: >-
  An ingress controller with HTTPS certificates: Traefik routes traffic
  from a load balancer to services, and cert-manager gets certificates from
  Let's Encrypt for them.
namespace: ingress
requires: A load balancer, or nodes reachable on their ports.
tags: [ingress, traefik, cert-manager, tls, letsencrypt]
fields:
  - key: email
    label: Email for Let's Encrypt
    hint: Leave empty to make only a self-signed issuer.
  - key: serviceType
    label: Traefik service
    type: select
    options: [LoadBalancer, NodePort]
    default: LoadBalancer
  - key: ingressClass
    label: Ingress class
    default: traefik
    hint: k3s already has one named traefik; pick another name there.
    advanced: true
components:
  - name: cert-manager
    title: cert-manager
    namespace: cert-manager
    helm:
      repo: https://charts.jetstack.io
      chart: cert-manager
      version: v1.21.3
      values: |
        crds:
          enabled: true
  - name: traefik
    title: Traefik
    helm:
      repo: https://traefik.github.io/charts
      chart: traefik
      version: 42.3.0
      values: |
        service:
          type: {{ .serviceType }}
        ingressClass:
          enabled: true
          isDefaultClass: true
          name: {{ .ingressClass }}
        providers:
          kubernetesIngress:
            ingressClass: {{ .ingressClass }}
            publishedService:
              enabled: true
          kubernetesCRD:
            ingressClass: {{ .ingressClass }}
  - name: issuers
    title: Certificate issuers
    manifest: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: selfsigned
      spec:
        selfSigned: {}
      {{- if .email }}
      ---
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: {{ quote .email }}
          privateKeySecretRef:
            name: letsencrypt-account
          solvers:
            - http01:
                ingress:
                  ingressClassName: {{ .ingressClass }}
      ---
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          email: {{ quote .email }}
          privateKeySecretRef:
            name: letsencrypt-staging-account
          solvers:
            - http01:
                ingress:
                  ingressClassName: {{ .ingressClass }}
      {{- end }}
notes: |
  Point your domain at the address of the `traefik` service in
  `{{ .Namespace }}`, then give an Ingress the class `{{ .ingressClass }}`
  {{- if .email }} and the annotation
  `cert-manager.io/cluster-issuer: letsencrypt`, with a `tls` section: its
  certificate comes from Let's Encrypt.

  Try `letsencrypt-staging` first: its limits are looser.
  {{- else }}.

  Run the stack again with an email to get certificates from Let's Encrypt;
  `cert-manager.io/cluster-issuer: selfsigned` makes self-signed ones.
  {{- end }}
