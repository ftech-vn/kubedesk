# kubedesk.cloud on the azure-k3s cluster (Traefik + cert-manager).
#   kubectl --context azure-k3s apply -f web/k8s/kubedesk-web.yaml
# The image pull secret "ghcr" is created separately (see web/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: kubedesk-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedesk-web
  namespace: kubedesk-web
  labels:
    app: kubedesk-web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: kubedesk-web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kubedesk-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kubedesk-web
      containers:
        - name: web
          image: ghcr.io/ftech-vn/kubedesk-web:20261024-2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubedesk-web
  namespace: kubedesk-web
spec:
  selector:
    app: kubedesk-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubedesk-cloud-tls
  namespace: kubedesk-web
spec:
  secretName: kubedesk-cloud-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - kubedesk.cloud
    - www.kubedesk.cloud
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: kubedesk-web
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubedesk-web
  namespace: kubedesk-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kubedesk.cloud
        - www.kubedesk.cloud
      secretName: kubedesk-cloud-tls
  rules:
    - host: kubedesk.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubedesk-web
                port:
                  name: http
    - host: www.kubedesk.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubedesk-web
                port:
                  name: http
---
# Plain HTTP redirects to HTTPS. cert-manager's HTTP-01 challenge adds its own,
# more specific route for /.well-known/acme-challenge, so it isn't redirected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubedesk-web-http
  namespace: kubedesk-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kubedesk-web-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kubedesk.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubedesk-web
                port:
                  name: http
    - host: www.kubedesk.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubedesk-web
                port:
                  name: http
